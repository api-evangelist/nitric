created: '2026-06-20'
modified: '2026-06-20'
reconciled: false
tags:
- Infrastructure from Code
- Cloud Framework
- SDK
- CLI
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of Nitric. The Nitric framework, SDKs, CLI, and provider plugins
  are free and open source (Apache 2.0), so there is no Nitric line item on a
  bill. The actual cost of a Nitric application is whatever your target cloud
  charges for the resources Nitric provisions and runs - the API gateways,
  queues, topics, buckets, key-value and SQL databases, secrets, websockets,
  and compute on AWS, Google Cloud, or Azure. FinOps practice for Nitric is
  therefore cloud-provider FinOps applied to the resources declared in code.
notes: >-
  Nitric adds no cost; spend is fully pass-through to the underlying cloud. Track
  and allocate via the target cloud's billing and cost-management tooling. A
  separate commercial Suga / Nitric Cloud offering may carry its own charges,
  not reconciled here.
sources:
- https://nitric.io
- https://nitric.io/docs
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Cloud Provider (AWS / Google Cloud / Azure)
serviceCategory: Developer Tools and Infrastructure
billingModel:
  pricingCategory: Pass-Through (Cloud Provider Usage)
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
focusColumns:
  ServiceName: Nitric-Provisioned Cloud Resources
  ServiceCategory: Developer Tools and Infrastructure
  ProviderName: AWS / Google Cloud / Azure
  PublisherName: AWS / Google Cloud / Azure
  InvoiceIssuerName: AWS / Google Cloud / Azure
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingCategory: Usage-Based
meters:
- name: api_gateway_requests
  description: Requests served by API gateways provisioned for Nitric API resources, billed by the target cloud.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - cloud
  - resource
- name: messaging_operations
  description: Queue and topic publish/consume operations provisioned for Nitric queues and topics, billed by the target cloud.
  unit: operations
  aggregation: sum
  dimensions:
  - account
  - cloud
  - resource
- name: storage_usage
  description: Object storage and key-value/SQL database usage provisioned for Nitric buckets, key-value stores, and databases, billed by the target cloud.
  unit: gb_month
  aggregation: sum
  dimensions:
  - account
  - cloud
  - resource
- name: compute_usage
  description: Compute / function execution backing Nitric services and handlers, billed by the target cloud.
  unit: gb_seconds
  aggregation: sum
  dimensions:
  - account
  - cloud
  - resource
principles:
- name: Visibility
  description: Use the target cloud's billing exports to inspect spend on resources Nitric provisions; Nitric itself adds no cost.
- name: Allocation
  description: Tag Nitric-provisioned resources per stack/environment and map to cost centers using cloud cost-allocation tags.
- name: Optimization
  description: Choose serverless/scale-to-zero targets, right-size databases, and tear down unused stacks with nitric down to avoid idle cloud charges.
- name: Accountability
  description: Assign owners per stack/environment; review provisioned-resource spend monthly against budget in the cloud cost tooling.
maintainers:
